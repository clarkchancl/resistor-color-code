<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電阻色碼轉換器</title>
<style>
:root{color-scheme:light;--ink:#172b35;--muted:#657780;--line:#dce7e9;--teal:#087e83;--pale:#eff8f7;--gold:#d4a52d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#f5f9f7,#edf5f5);color:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",sans-serif;display:grid;place-items:center;padding:32px 18px}
main{width:min(100%,760px)}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--teal);text-transform:uppercase}.heading{margin:9px 0 8px;font-size:clamp(27px,5vw,38px);letter-spacing:-.04em}.intro{margin:0;color:var(--muted);line-height:1.7}.card{margin-top:27px;background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,38px);box-shadow:0 18px 50px #1839430b}.label{display:block;font-weight:700;font-size:14px;margin-bottom:10px}.inputrow{display:flex;gap:12px}.inputwrap{position:relative;flex:1}.inputwrap input{width:100%;height:52px;border:1px solid #cbd9dc;border-radius:10px;padding:0 54px 0 16px;font-size:17px;color:var(--ink);outline:none;transition:.15s}.inputwrap input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #087e831c}.unit{position:absolute;right:17px;top:50%;transform:translateY(-50%);color:var(--muted)}button{height:52px;padding:0 26px;border:0;border-radius:10px;background:var(--teal);color:white;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}button:hover{background:#06696d;transform:translateY(-1px)}button:focus-visible{outline:3px solid #78c6c4;outline-offset:3px}.hint{margin:10px 0 0;color:var(--muted);font-size:13px}.error{min-height:20px;color:#b43b37;font-size:13px;margin-top:7px}.result{border-top:1px solid var(--line);margin-top:20px;padding-top:25px;display:none}.result.show{display:block;animation:appear .25s ease}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.resulttop{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.result h2{margin:0;font-size:18px}.value{color:var(--teal);font-size:14px;font-weight:700}.resultbody{margin-top:20px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(220px,.85fr);gap:22px;align-items:center}.resistorbox{min-height:192px;border-radius:14px;background:var(--pale);display:grid;place-items:center;padding:18px}.resistorbox svg{width:100%;max-width:400px;height:auto;overflow:visible}.legend{display:grid;gap:9px}.bandrow{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid #e5edef;border-radius:10px}.swatch{width:18px;height:28px;border-radius:5px;flex:none;border:1px solid #00000016}.bandtext{flex:1;display:flex;justify-content:space-between;gap:8px;font-size:13px}.bandtext span:first-child{color:var(--muted)}.bandtext strong{font-size:13px}.footnote{color:var(--muted);font-size:12px;line-height:1.6;margin:16px 0 0}.footer{text-align:center;color:#819096;font-size:12px;margin:18px 0 0}
@media(max-width:600px){body{padding:22px 14px}.inputrow{flex-direction:column}.inputrow button{width:100%}.resultbody{grid-template-columns:1fr;gap:15px}.resistorbox{min-height:160px}.resulttop{align-items:flex-start;flex-direction:column;gap:5px}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Resistor color code</div>
  <h1 class="heading">電阻色碼轉換器</h1>
  <p class="intro">輸入電阻值，快速查看對應的四環電阻色碼。</p>
  <section class="card" aria-label="電阻色碼轉換">
    <form id="form" novalidate>
      <label class="label" for="resistance">電阻值</label>
      <div class="inputrow">
        <div class="inputwrap"><input id="resistance" name="resistance" type="text" inputmode="decimal" autocomplete="off" placeholder="例如：1k、4.7k、470" aria-describedby="hint error"><span class="unit">Ω</span></div>
        <button type="submit">確認</button>
      </div>
      <p class="hint" id="hint">可使用 Ω、k、M、G 表示單位，例如 1k = 1,000 Ω。</p>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
    </form>
    <section class="result" id="result" aria-live="polite">
      <div class="resulttop"><h2>四環色碼</h2><div class="value" id="value"></div></div>
      <div class="resultbody">
        <div class="resistorbox"><svg id="drawing" viewBox="0 0 440 150" role="img" aria-label="電阻色環示意圖"></svg></div>
        <div class="legend" id="legend"></div>
      </div>
      <p class="footnote">色環由左至右：前兩環為有效數字，第三環為倍率，第四環為誤差。誤差環目前固定為金色（±5%）。</p>
    </section>
  </section>
  <p class="footer">輸入阻值後按「確認」查看結果</p>
</main>
<script>
const colors=[
 {name:'黑',hex:'#25292c',text:'#fff',digit:0,mul:0},
 {name:'棕',hex:'#8b4b2b',text:'#fff',digit:1,mul:1},
 {name:'紅',hex:'#d7443e',text:'#fff',digit:2,mul:2},
 {name:'橙',hex:'#ed8a32',text:'#172b35',digit:3,mul:3},
 {name:'黃',hex:'#f1cf4a',text:'#172b35',digit:4,mul:4},
 {name:'綠',hex:'#3b9365',text:'#fff',digit:5,mul:5},
 {name:'藍',hex:'#3979bd',text:'#fff',digit:6,mul:6},
 {name:'紫',hex:'#8058a6',text:'#fff',digit:7,mul:7},
 {name:'灰',hex:'#969da3',text:'#172b35',digit:8,mul:8},
 {name:'白',hex:'#f7f7f2',text:'#172b35',digit:9,mul:9},
 {name:'金',hex:'#d4a52d',text:'#172b35',mul:-1},
 {name:'銀',hex:'#aeb8c0',text:'#172b35',mul:-2}
];
const form=document.querySelector('#form'),input=document.querySelector('#resistance'),error=document.querySelector('#error'),result=document.querySelector('#result');
function parseOhms(raw){const m=raw.trim().replace(/[ΩΩ\s]/g,'').match(/^([+]?(?:\d+(?:\.\d*)?|\.\d+))([kKmMgG]?)$/);if(!m)return null;const scale={"":1,k:1e3,m:1e6,g:1e9}[m[2].toLowerCase()];const n=Number(m[1])*scale;return Number.isFinite(n)&&n>=0?n:null}
function encode(ohms){for(let exponent=-2;exponent<=9;exponent++){const sig=ohms/Math.pow(10,exponent);const rounded=Math.round(sig);if(Math.abs(sig-rounded)<Math.max(1e-9,Math.abs(sig)*1e-10)&&rounded>=10&&rounded<=99){return {first:Math.floor(rounded/10),second:rounded%10,exponent}}}return null}
function formatOhms(n){if(n>=1e9)return `${Number((n/1e9).toPrecision(6))} GΩ`;if(n>=1e6)return `${Number((n/1e6).toPrecision(6))} MΩ`;if(n>=1e3)return `${Number((n/1e3).toPrecision(6))} kΩ`;return `${Number(n.toPrecision(6))} Ω`}
function draw(bands){const svg=document.querySelector('#drawing');const rect=`<defs><linearGradient id="body" x2="0" y2="1"><stop stop-color="#f2dfb8"/><stop offset=".48" stop-color="#e4c992"/><stop offset="1" stop-color="#c9a96d"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#34454a" flood-opacity=".18"/></filter></defs><line x1="20" y1="75" x2="420" y2="75" stroke="#9da9aa" stroke-width="5"/><path d="M105 43 Q105 30 120 30 H320 Q335 30 335 43 V107 Q335 120 320 120 H120 Q105 120 105 107Z" fill="url(#body)" stroke="#b39765" stroke-width="2" filter="url(#shadow)"/>`;
const xs=bands.length===1?[213]:[139,183,257,302];const bandsSvg=bands.map((b,i)=>`<rect x="${xs[i]}" y="30" width="${i===3?15:13}" height="90" rx="1" fill="${b.hex}" stroke="#000" stroke-opacity=".08"/>`).join('');svg.innerHTML=rect+bandsSvg;}
function show(ohms,code){if(ohms===0){showZero();return}const bands=[colors[code.first],colors[code.second],colors.find(c=>c.mul===code.exponent),colors.find(c=>c.name==='金')];const labels=['第一環・第一位數','第二環・第二位數','第三環・倍率','第四環・誤差'];document.querySelector('#value').textContent=`${formatOhms(ohms)}　·　±5%`;document.querySelector('#legend').innerHTML=bands.map((c,i)=>`<div class="bandrow"><span class="swatch" style="background:${c.hex}"></span><div class="bandtext"><span>${labels[i]}</span><strong>${c.name}色${i===2?`（×${Math.pow(10,code.exponent)}）`:i===3?'（±5%）':''}</strong></div></div>`).join('');draw(bands);error.textContent='';result.classList.add('show')}
function showZero(){const black=colors[0];document.querySelector('.result h2').textContent='單環色碼';document.querySelector('#value').textContent='0 Ω';document.querySelector('#legend').innerHTML='<div class="bandrow"><span class="swatch" style="background:'+black.hex+'"></span><div class="bandtext"><span>單環色碼</span><strong>黑色</strong></div></div>';document.querySelector('.footnote').textContent='0 Ω 特例以單一黑色色環表示。';draw([black]);error.textContent='';result.classList.add('show')}
form.addEventListener('submit',e=>{e.preventDefault();const ohms=parseOhms(input.value);if(ohms===null){error.textContent='請輸入有效阻值，例如 1k、4.7k 或 470。';result.classList.remove('show');return}if(ohms===0){showZero();return}document.querySelector('.result h2').textContent='四環色碼';document.querySelector('.footnote').textContent='色環由左至右：前兩環為有效數字，第三環為倍率，第四環為誤差。誤差環目前固定為金色（±5%）。';const code=encode(ohms);if(!code){error.textContent='此數值無法以標準四環色碼表示，請輸入可用兩位有效數字與倍率表示的阻值（約 0.1 Ω 至 99 GΩ）。';result.classList.remove('show');return}show(ohms,code)});
</script>
</body>
</html>
